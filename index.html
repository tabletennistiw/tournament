<style>
:root {
  --bg:#1e1018; --surface:#2a1520; --border:#4a2a38;
  --accent:#E5B25D; --text:#E1E2EF; --muted:#8a6a78;
  --win:#7ec8a0; --loss:#d9534f; --admin:#c9a0dc;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* HEADER */
header{width:100%;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.75rem;position:relative;z-index:10;}
.header-logo{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
header h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.08em;color:var(--accent);line-height:1;}
.header-sub{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
#admin-btn{background:none;border:1px solid var(--border);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.35rem .65rem;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;}
#admin-btn:hover{border-color:var(--admin);color:var(--admin);}
#admin-btn.on{border-color:var(--admin);color:var(--admin);background:rgba(201,160,220,.1);}
.admin-btn-label{display:none;}
@media(min-width:480px){.admin-btn-label{display:inline;}header{padding:1.1rem 1.75rem;}header h1{font-size:2.6rem;}main{padding:1.5rem 1.75rem;}}
@media(min-width:640px){header{padding:1.2rem 2rem;}header h1{font-size:3rem;}nav{padding:0 2rem;}main{padding:1.75rem 2rem;}}

/* LIVE SIGNAL */
.lb-signal{display:flex;align-items:center;gap:.35rem;cursor:default;}
.lb-signal-bars{display:flex;align-items:flex-end;gap:2px;height:13px;}
.lb-sb{width:3px;border-radius:1px;background:var(--accent);opacity:.25;transition:opacity .25s;}
.lb-sb.active{opacity:1;}
.lb-sb:nth-child(1){height:4px;}.lb-sb:nth-child(2){height:7px;}
.lb-sb:nth-child(3){height:10px;}.lb-sb:nth-child(4){height:13px;}
.lb-signal-label{font-family:'DM Mono',monospace;font-size:.52rem;color:var(--accent);letter-spacing:.08em;}

/* NAV */
nav{width:100%;border-bottom:1px solid var(--border);position:relative;z-index:9;
  display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;
  font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;padding:.8rem 1rem;
  cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0;}
nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
nav button:hover:not(.active){color:var(--text);}

/* MAIN */
main{padding:1.25rem;position:relative;z-index:1;width:100%;overflow-x:visible;}
.panel{display:none;}.panel.active{display:block;width:100%;}

/* LEADERBOARD */
#panel-leaderboard{max-width:860px;margin-left:auto;margin-right:auto;}
.lb-head-row{display:grid;grid-template-columns:2.6rem 1fr 6rem 4rem;padding:.5rem .7rem;
  border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:100%;box-sizing:border-box;}
.lb-h-pts,.lb-h-wl{text-align:right;}
.lb-bar{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,rgba(229,178,93,.13) 0%,rgba(229,178,93,0) 100%);
  transition:width 1s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:0;
}
.lb-row{
  position:absolute;left:0;right:0;
  display:grid;grid-template-columns:2.6rem 1fr 6rem 4rem;
  padding:.75rem .7rem;
  border-bottom:1px solid rgba(74,42,56,.4);
  background:var(--bg);
  align-items:center;
  box-sizing:border-box;
  overflow:hidden;
  transition:transform .38s cubic-bezier(.4,0,.2,1),box-shadow .18s,background .18s;
}
.lb-row>*:not(.lb-bar){position:relative;z-index:1;}
.lb-row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent);box-shadow:inset 3px 0 0 rgba(229,178,93,.55);}
.lb-row.is-rank-0{background:color-mix(in srgb,#ffd700 3%,var(--bg));box-shadow:inset 3px 0 0 rgba(255,215,0,.7);}
.lb-row.is-rank-1{box-shadow:inset 3px 0 0 rgba(192,192,192,.5);}
.lb-row.is-rank-2{box-shadow:inset 3px 0 0 rgba(205,127,50,.5);}
.lb-row.is-rank-0:hover{background:color-mix(in srgb,#ffd700 6%,var(--bg));box-shadow:inset 3px 0 0 #ffd700;}
.lb-row .lb-col-pts{text-align:right;}
.lb-row .lb-col-wl{text-align:right;}
@keyframes lbRowEnter{
  from{opacity:0;transform:translateY(var(--ty)) scaleY(0.1);}
  to  {opacity:1;transform:translateY(var(--ty)) scaleY(1);}
}
.lb-row.is-entering{
  animation:lbRowEnter .45s cubic-bezier(.34,1.4,.64,1) forwards;
  transform-origin:top center;transition:none;
}
@keyframes lbRowExit{
  from{opacity:1;transform:translateY(var(--ty)) scaleY(1);}
  to  {opacity:0;transform:translateY(var(--ty)) scaleY(0.1);}
}
.lb-row.is-exiting{
  animation:lbRowExit .28s ease-in forwards;
  transform-origin:top center;transition:none;
  pointer-events:none;z-index:10;
}
.rank{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:var(--muted);white-space:nowrap;line-height:1;}
.rank.top1{color:#ffd700;font-size:1.4rem;text-shadow:0 0 12px rgba(255,215,0,.4);}
.rank.top2{color:#c0c0c0;font-size:1.25rem;}
.rank.top3{color:#cd7f32;font-size:1.2rem;}
.lb-av-ph{width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.8rem;font-weight:700;flex-shrink:0;
  border:1.5px solid transparent;transition:box-shadow .2s;}
.lb-av-ph.av-rank-0{border-color:rgba(255,215,0,.5);box-shadow:0 0 8px rgba(255,215,0,.2);}
.lb-av-ph.av-rank-1{border-color:rgba(192,192,192,.4);}
.lb-av-ph.av-rank-2{border-color:rgba(205,127,50,.4);}
.player-name{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;flex:1;min-width:0;}
.pname-cell{display:flex;align-items:center;gap:.5rem;min-width:0;}
.pts-val{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--accent);letter-spacing:.05em;white-space:nowrap;}
.record-badge{font-family:'DM Mono',monospace;font-size:.58rem;display:inline-flex;flex-direction:column;gap:.05rem;white-space:nowrap;text-align:right;line-height:1.35;}
.record-badge .w{color:var(--win);}.record-badge .l{color:var(--loss);}

/* FORMS */
.matches-layout{display:grid;grid-template-columns:1fr;gap:1.25rem;}
@media(min-width:700px){.matches-layout{grid-template-columns:280px 1fr;}}
.form-card{background:var(--surface);border:1px solid var(--border);padding:1.25rem;margin-bottom:1.25rem;width:100%;}
.form-card h2{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.08em;margin-bottom:1rem;color:var(--text);}
.field{margin-bottom:.9rem;}
label{display:block;font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
input:not([type=checkbox]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:.88rem;padding:.6rem .85rem;outline:none;
  transition:border-color .2s;appearance:none;border-radius:0;}
input:not([type=checkbox]):focus,select:focus,textarea:focus{border-color:var(--accent);}
input:not([type=checkbox])::placeholder,textarea::placeholder{color:var(--muted);}
.btn{background:var(--accent);color:#1e1018;border:none;font-family:'DM Mono',monospace;
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:.7rem 1.4rem;
  cursor:pointer;font-weight:500;transition:all .15s;display:inline-block;border-radius:0;}
.btn:hover{background:#f5e6cc;}.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:.45rem .85rem;cursor:pointer;transition:all .15s;border-radius:0;}
.btn-ghost:hover{border-color:var(--text);color:var(--text);}
.btn-danger{background:var(--loss);color:#fff;border:none;font-family:'DM Mono',monospace;
  font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:.38rem .65rem;
  cursor:pointer;transition:opacity .15s;border-radius:0;}
.btn-danger:hover{opacity:.8;}
.btn-admin{background:rgba(201,160,220,.12);color:var(--admin);border:1px solid var(--admin);
  font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;
  padding:.38rem .65rem;cursor:pointer;transition:all .15s;border-radius:0;}
.btn-admin:hover{background:rgba(201,160,220,.22);}
.msg{font-family:'DM Mono',monospace;font-size:.68rem;padding:.6rem .85rem;margin-top:.65rem;
  border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--accent);display:none;}
.msg.err{border-color:var(--loss);background:rgba(255,71,87,.05);color:var(--loss);}

/* HISTORY */
.hist-filters{display:flex;gap:.65rem;margin-bottom:1rem;flex-wrap:wrap;}
.hist-filters select{width:auto;min-width:150px;flex:1;}
.match-row{background:var(--surface);border:1px solid var(--border);padding:.75rem .9rem;
  margin-bottom:.35rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4rem;}
.match-player{display:flex;flex-direction:column;gap:.1rem;}
.match-player .name{font-weight:600;font-size:.82rem;}
.match-player .delta{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--win);}
.match-mid{text-align:center;}
.match-result{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--muted);letter-spacing:.07em;
  display:flex;align-items:center;gap:.3rem;justify-content:center;white-space:nowrap;}
.match-result .ws{color:var(--win);font-size:.8rem;}
.match-date-lbl{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--muted);margin-top:.2rem;}
.match-score-display{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}
.empty{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);text-align:center;padding:2.5rem 1rem;border:1px dashed var(--border);}
.loading{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);text-align:center;padding:2.5rem;letter-spacing:.1em;}
.loading::after{content:'';display:inline-block;width:10px;height:10px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;margin-left:8px;vertical-align:middle;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* PLAYER LIST */
.player-list-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .65rem;
  background:var(--surface);border:1px solid var(--border);margin-bottom:.3rem;}
.player-list-item .pli-name{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:.06em;flex:1;text-transform:uppercase;}
.player-list-item .pli-pts{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--accent);}
.player-list-item .pli-rec{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--muted);}

/* BRACKETS */
.br-viewport{width:100%;height:480px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--border);border-radius:3px;cursor:grab;touch-action:none;user-select:none;}
.br-viewport.drag{cursor:grabbing;}
.br-world{position:absolute;top:0;left:0;transform-origin:top left;will-change:transform;}
.br-pill{font-family:'DM Mono',monospace;font-size:.46rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.14rem .4rem;border-radius:2px;border:1px solid;display:inline-block;margin-left:.35rem;}
.br-pill.winners{color:var(--accent);border-color:rgba(229,178,93,.4);background:rgba(229,178,93,.08);}
.br-pill.losers{color:#ff6b35;border-color:rgba(255,107,53,.35);background:rgba(255,107,53,.07);}

/* MODAL */
.am-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:1rem;pointer-events:none;opacity:0;transition:opacity .18s;}
.am-overlay.open{pointer-events:all;opacity:1;}
.am-box{background:var(--surface);border:1px solid var(--border);padding:1.5rem;width:100%;max-width:420px;}
.am-box h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.08em;margin-bottom:1.1rem;color:var(--text);}
.m-close{background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;
  font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:.28rem .55rem;cursor:pointer;flex-shrink:0;}

/* ADMIN */
.admin-section{margin-bottom:1.5rem;}
.admin-stitle{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--admin);margin-bottom:.65rem;border-bottom:1px solid rgba(201,160,220,.2);padding-bottom:.4rem;}
.streak-badge{font-family:'DM Mono',monospace;font-size:.52rem;color:#ff6b35;background:rgba(255,107,53,.12);
  border:1px solid rgba(255,107,53,.35);padding:.1rem .35rem;border-radius:2px;white-space:nowrap;margin-left:.3rem;}
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 15 65 40" style="height:32px;width:auto;flex-shrink:0;color:var(--accent)">
      <g fill="currentColor" transform="matrix(0.67465,0,0,0.67465,0,17)">

    <h1>TTTIW</h1>
  </div>
  <div class="header-right">
    <div id="lb-signal" class="lb-signal">
      <div class="lb-signal-bars">
        <div class="lb-sb" id="lb-sb1"></div><div class="lb-sb" id="lb-sb2"></div>
        <div class="lb-sb" id="lb-sb3"></div><div class="lb-sb" id="lb-sb4"></div>
      </div>
      <span class="lb-signal-label">LIVE</span>
    </div>
    <button id="admin-btn" onclick="openAdminLogin()">⚙<span class="admin-btn-label" id="admin-btn-label"> Admin</span></button>
  </div>
</header>

<nav>
  <button class="active" onclick="showPanel('leaderboard',this)">Leaderboard</button>
  <button onclick="showPanel('matches',this)">Matches</button>
  <button onclick="showPanel('brackets',this)">Tournaments</button>
  <button id="admin-tab-btn" onclick="showPanel('admin',this)" style="display:none;color:var(--admin)">★ Admin</button>
</nav>

<main>
  <div id="panel-leaderboard" class="panel active">
    <div id="lb-loading" class="loading">Loading leaderboard</div>
    <div id="lb-table" style="display:none">
      <div class="lb-head-row">
        <span>#</span><span>Player</span>
        <span class="lb-h-pts">Points</span>
        <span class="lb-h-wl">W–L</span>
      </div>
      <div id="lb-list" style="position:relative;width:100%"></div>
    </div>
  </div>

  <div id="panel-matches" class="panel">
    <div class="matches-layout">
      <div class="matches-sidebar">
        <div class="form-card">
          <h2>Submit Match</h2>
          <div class="field"><label>Winner</label><select id="match-winner"></select></div>
          <div class="field"><label>Loser</label><select id="match-loser"></select></div>
          <div class="field"><label>Score</label><input type="text" id="match-score" placeholder="e.g. 11-7"></div>
          <button class="btn" onclick="submitMatch()">Submit Match</button>
          <div class="msg" id="match-msg"></div>
        </div>
        <div class="form-card">
          <h2>Add Player</h2>
          <div class="field"><label>Name</label><input type="text" id="player-name-in"></div>
          <div class="field"><label>Number (00-99)</label><input type="number" id="player-num-in" min="0" max="99"></div>
          <button class="btn" onclick="addPlayer()">Add Player</button>
          <div class="msg" id="player-msg"></div>
        </div>
      </div>
      <div class="matches-main">
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <div id="panel-brackets" class="panel">
    <div id="brackets-list"></div>
  </div>

  <div id="panel-admin" class="panel">
    <div style="max-width:520px">
      <div class="admin-section">
        <div class="admin-stitle">Scoring Rules</div>
        <div class="form-card">
          <div class="field"><label>Win Points</label><input type="number" id="scoring-win"></div>
          <div class="field"><label>Loss Points</label><input type="number" id="scoring-loss"></div>
          <div class="field"><label>Streak Bonus</label><input type="number" id="scoring-streak"></div>
          <button class="btn-admin" onclick="saveScoring()">Save Rules</button>
        </div>
      </div>
      <div class="admin-section">
        <div class="admin-stitle">Danger Zone</div>
        <div class="form-card" style="border-color:rgba(217,83,79,.3)">
           <button class="btn-danger" style="width:100%" onclick="resetAllData()">Reset All Data</button>
           <p style="font-family:'DM Mono',monospace;font-size:.52rem;color:var(--muted);margin-top:.75rem;text-align:center;">Deletes all players and matches. Preserves scoring config.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
let players = [];
let matches = [];
let scoring = { winPts: 500, lossPts: 300, streakBonus: 50 };
let isAdmin = false;

async function loadData() {
  players = JSON.parse(localStorage.getItem('players') || '[]');
  matches = JSON.parse(localStorage.getItem('matches') || '[]');
  const savedScoring = localStorage.getItem('config/scoring');
  if (savedScoring) scoring = JSON.parse(savedScoring);
  renderLeaderboard();
}

function renderLeaderboard() {
  const list = document.getElementById('lb-list');
  list.innerHTML = '';
  document.getElementById('lb-loading').style.display = 'none';
  document.getElementById('lb-table').style.display = 'block';

  players.sort((a,b) => b.points - a.points).forEach((p, idx) => {
    const row = _lbCreateEl(p, idx);
    list.appendChild(row);
  });
}

function _lbCreateEl(p, idx) {
  const row = document.createElement('div');
  row.className = 'lb-row';
  row.style.setProperty('--ty', (idx * 60) + 'px');
  row.style.transform = `translateY(${idx * 60}px)`;

  const rank = document.createElement('div');
  rank.className = 'rank';
  rank.textContent = idx + 1;

  const nameCell = document.createElement('div');
  nameCell.className = 'pname-cell';
  const badge = document.createElement('span');
  badge.className = 'lb-num-badge'; // Fixed class name for retrieval
  badge.textContent = p.number || '??';
  badge.style.cssText = "font-family:'DM Mono'; font-size:.6rem; color:var(--muted); border:1px solid var(--border); padding:2px 4px; border-radius:2px;";
  
  const name = document.createElement('div');
  name.className = 'player-name';
  name.textContent = p.name;

  nameCell.appendChild(badge);
  nameCell.appendChild(name);

  const pts = document.createElement('div');
  pts.className = 'lb-col-pts pts-val';
  pts.textContent = p.points;

  const wl = document.createElement('div');
  wl.className = 'lb-col-wl record-badge';
  wl.innerHTML = `<span class="w">${p.wins}W</span><span class="l">${p.losses}L</span>`;

  row.appendChild(rank);
  row.appendChild(nameCell);
  row.appendChild(pts);
  row.appendChild(wl);
  return row;
}

function resetAllData() {
  if (!confirm("Are you sure? This will permanently delete ALL players and match history.")) return;
  
  // Clear core data
  localStorage.removeItem('players');
  localStorage.removeItem('matches');
  localStorage.removeItem('device_matches');
  
  // Clear tournament configs
  localStorage.removeItem('config/brackets');
  localStorage.removeItem('config/pastTournaments');
  
  // Reset local state
  players = [];
  matches = [];
  
  alert("Database reset successful.");
  location.reload();
}

function openAdminLogin() {
  const pass = prompt("Admin Password:");
  if (pass === 'tttiw123') {
    isAdmin = true;
    document.getElementById('admin-tab-btn').style.display = 'block';
    document.getElementById('admin-btn').classList.add('on');
    alert("Logged in as Admin");
  }
}

function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

loadData();
</script>
</body>
</html>
